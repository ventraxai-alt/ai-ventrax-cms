<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Ventrax | AI News, Tools & Tutorials</title>
<meta name="description" content="AI Ventrax — AI news, tools, tutorials, reviews and digital guides.">
<style>
:root{--bg:#071126;--card:#102044;--text:#f4f7ff;--muted:#aab8d4;--a:#39d9ff;--b:#647cff;--line:#26385e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061024,#0a1939,#061024);color:var(--text);font:16px/1.65 Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(92%,1150px);margin:auto}
header{position:sticky;top:0;z-index:10;background:#071126f5;border-bottom:1px solid var(--line)}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--b),var(--a));color:#061024;margin-right:8px}nav{display:flex;gap:17px}nav a{font-size:14px}nav a:hover{color:var(--a)}
.hero{padding:75px 0 50px}.pill{display:inline-block;border:1px solid #285a74;color:var(--a);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:900}h1{font-size:clamp(40px,7vw,72px);line-height:1.02;max-width:850px;margin:18px 0}.hero p{color:var(--muted);max-width:730px;font-size:18px}
section{padding:45px 0}.head{margin-bottom:20px}.head h2{font-size:30px;margin:0}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:linear-gradient(145deg,#12234a,#0d1b39);border:1px solid var(--line);border-radius:15px;padding:20px}.card h3{margin:7px 0}.card p{color:var(--muted)}.tag{font-size:11px;color:var(--a);font-weight:900;text-transform:uppercase}.btn{display:inline-block;padding:10px 15px;border:1px solid var(--line);border-radius:9px;font-weight:800}.primary{background:linear-gradient(135deg,var(--b),var(--a));color:#061024;border:0}
.article{max-width:850px}.article img{max-width:100%;border-radius:12px}.empty{color:var(--muted);padding:25px 0}.ad{min-height:85px;border:1px dashed #425476;border-radius:12px;display:grid;place-items:center;color:#8593b0;margin-top:20px;font-size:12px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:30px 0;color:var(--muted)}@media(max-width:750px){nav{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/"><span class="logo">AV</span>AI Ventrax</a><nav><a href="/">Home</a><a href="/?category=AI News">AI News</a><a href="/?category=AI Tools">AI Tools</a><a href="/?category=Tutorials">Tutorials</a><a href="/?category=Reviews">Reviews</a><a href="/admin">Admin</a></nav></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">AI Ventrax • AI • Technology • Tools • Tutorials<br><small>Privacy Policy • Disclaimer • Affiliate Disclosure • Contact</small></div></footer>
<script>
const API='/api';
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function getPosts(){let r=await fetch(API+'/posts');return r.ok?r.json():[]}
function card(p){return `<article class="card"><span class="tag">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt||'')}</p><a class="btn" href="?post=${encodeURIComponent(p.id)}">Read article →</a></article>`}
async function render(){
 const app=document.getElementById('app'), q=new URLSearchParams(location.search), id=q.get('post'), cat=q.get('category'), posts=await getPosts();
 if(id){let p=posts.find(x=>String(x.id)===id); if(!p){app.innerHTML='<section><h1>Article not found</h1></section>';return}
 app.innerHTML=`<section class="article"><span class="tag">${esc(p.category)}</span><h1>${esc(p.title)}</h1><p>Published ${esc(p.date||'')} • ${esc(p.author||'AI Ventrax')}</p>${p.image?`<img src="${esc(p.image)}" alt="">`:''}<div>${p.content||''}</div><p class="tag">Affiliate disclosure: Some links may be affiliate links.</p></section>`;return}
 let filtered=cat?posts.filter(p=>p.category===cat):posts;
 app.innerHTML=`<section class="hero"><span class="pill">AI • TECHNOLOGY • DIGITAL WORLD</span><h1>AI Ventrax</h1><p>Original AI news, useful tools, tutorials, reviews and digital guides.</p></section><section><div class="head"><h2>🔥 ${esc(cat||'Latest AI News')}</h2><p>Fresh articles published from the AI Ventrax CMS.</p></div><div class="grid">${filtered.length?filtered.map(card).join(''):'<div class="empty">No published articles yet. Add your first article from Admin.</div>'}</div><div class="ad">ADVERTISEMENT — reserved placement</div></section>`}
render();
</script>
</body></html>
